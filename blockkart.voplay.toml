format = 1
canonical_module = "github.com/vo-lang/blockkart"

[game]
package = "main"
type_name = "BlockKart"
init_type = "BlockKartInit"
configure = "ConfigureBlockKart"
start = "StartBlockKart"
execute = "ExecuteBlockKart"
max_init_bytes = 4096
max_world_entities = 2048
max_world_commands = 16384
max_world_changes = 4096
max_world_component_bytes = 4194304
roles = ["logic", "asset", "render", "audio"]

[[game.init_field]]
name = "seed"
type = "uint64"
default = "1"
editor = ""

[[game.init_field]]
name = "difficulty"
type = "uint32"
default = "1"
editor = ""

